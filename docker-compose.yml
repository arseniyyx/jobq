services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/jobq
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-dev-webhook-secret}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2  # SKIP LOCKED lets any number of workers share the queue safely

volumes:
  pgdata:
